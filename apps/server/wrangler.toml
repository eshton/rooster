# Cloudflare Workers deployment for the Rooster server (Hono + MCP).
#
# Backed by libSQL/Turso over HTTP. Build then deploy:
#   pnpm --filter @rooster/server build
#   pnpm --filter @rooster/server deploy:worker
#
# Required vars/secrets (set non-secrets in [vars], secrets via `wrangler secret put`):
#   DATABASE_URL          libsql://<your-db>.turso.io        (var or secret)
#   DATABASE_AUTH_TOKEN   <turso token>                      (secret)
#   ROOSTER_AUTH_SECRET   <32-byte random>                   (secret)
#   ROOSTER_BASE_URL      https://<your-worker-domain>       (var)
#   ROOSTER_SIGNUP_TOKEN  <tenant signup gate>               (secret, optional)
#
# Migrate before first use (from Node/CI, not the Worker):
#   DATABASE_URL=libsql://… DATABASE_AUTH_TOKEN=… pnpm --filter @rooster/db db:migrate
#   DATABASE_URL=libsql://… DATABASE_AUTH_TOKEN=… pnpm --filter @rooster/server auth:migrate
name = "rooster-server"
main = "dist/worker.js"
compatibility_date = "2026-06-25"
compatibility_flags = ["nodejs_compat"]

# Plain-text (NON-SECRET) vars live here, NOT in the dashboard. `wrangler deploy`
# reconciles plain vars to this file — any dashboard-set var NOT listed here is
# DELETED on every deploy (secrets are unaffected). Keeping the non-secret config
# in git makes deploys reproducible and stops the CI auto-deploy from wiping it.
# Secrets (the API keys, DB token, auth secret) are set once via `wrangler secret
# put` / the dashboard and persist across deploys — never put a secret here.
[vars]
# ROOSTER_BASE_URL must match the host the Worker is served on (used as the OAuth
# issuer + MCP resource identifier); a mismatch breaks OAuth/MCP discovery.
ROOSTER_BASE_URL = "https://app.airooster.dev"

# Semantic search (Cloudflare Workers AI, bge-m3 → 1024 dims). Non-secret config;
# ROOSTER_EMBEDDING_API_KEY is a Secret. DIMS must match the model's output size.
ROOSTER_EMBEDDING_URL = "https://api.cloudflare.com/client/v4/accounts/d125ee0cc19ada9506786d281ba892be/ai/v1/embeddings"
ROOSTER_EMBEDDING_MODEL = "@cf/baai/bge-m3"
ROOSTER_EMBEDDING_DIMS = "1024"

# Optional reranker (Cloudflare Workers AI bge-reranker). ROOSTER_RERANK_API_KEY
# is a Secret.
ROOSTER_RERANK_URL = "https://api.cloudflare.com/client/v4/accounts/d125ee0cc19ada9506786d281ba892be/ai/run/@cf/baai/bge-reranker-base"
ROOSTER_RERANK_MODEL = "@cf/baai/bge-reranker-base"
