name: Publish image

# Manually publish a multi-arch server image to the GitHub Container Registry.
# Trigger from the Actions tab ("Run workflow") and pick a tag. Nothing publishes
# automatically — releasing an image is always a deliberate click.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (e.g. latest, v0.1.0)'
        default: 'latest'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 for most servers/CI, arm64 for Apple Silicon + ARM hosts.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
